# DataPilot — example Docker Compose deployment.
#
# This file is a portable starting point — keep it in the source repo. Real
# deployments should copy it to a private location (outside the repo) and
# layer on host-specific bind mounts (Work vault, skillshub, project skill
# repos, etc.) without polluting the public source tree.
#
# Quick start (generic):
#   1. cp docker-compose.example.yml docker-compose.yml
#   2. cp .env.example .env  &&  edit .env (set DATAPILOT_SERVER_TOKEN)
#   3. docker compose up --build
#   4. Open http://localhost:9100
#
# For a richer example with project-specific mounts (skillshub overlays,
# per-project agent workspaces with symlinked skills, talent-graph readonly
# share-source mounts), see the host-specific deployment kept under
# `~/Documents/docker/datapilot-deploy/` (private).

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        - DATAPILOT_DISABLE_OAUTH=${DATAPILOT_DISABLE_OAUTH:-1}
        - DATAPILOT_DISABLE_BROWSER=${DATAPILOT_DISABLE_BROWSER:-1}
        - DATAPILOT_DISABLE_VALIDATION=${DATAPILOT_DISABLE_VALIDATION:-}
        - DATAPILOT_DISABLE_TEMPLATES=${DATAPILOT_DISABLE_TEMPLATES:-}
        - DATAPILOT_DISABLE_SANDBOX=${DATAPILOT_DISABLE_SANDBOX:-1}
        - DATAPILOT_DISABLE_MESSAGING=${DATAPILOT_DISABLE_MESSAGING:-1}
        - DATAPILOT_LITE_UI=${DATAPILOT_LITE_UI:-1}
    ports:
      - "${DATAPILOT_RPC_PORT:-9100}:9100"
    environment:
      - DATAPILOT_SERVER_TOKEN=${DATAPILOT_SERVER_TOKEN}
      - DATAPILOT_WEBUI_PASSWORD=${DATAPILOT_WEBUI_PASSWORD:-}
      - DATAPILOT_RPC_HOST=0.0.0.0
      - DATAPILOT_RPC_PORT=9100
      - DATAPILOT_HEALTH_PORT=9101
      - DATAPILOT_VIEWER_URL=${DATAPILOT_VIEWER_URL:-http://host.docker.internal:9101}
      # Global ceiling on concurrent batch sessions across all batches (default 10 when unset).
      - DATAPILOT_BATCH_GLOBAL_MAX_CONCURRENT_SESSIONS=${DATAPILOT_BATCH_GLOBAL_MAX_CONCURRENT_SESSIONS:-}
      # [fork] Optional search/fetch provider cascade keys.
      # Order: TinyFish → Firecrawl → Tavily → Exa → DDG (search) / local (fetch).
      # Each key is shared by web_search and web_fetch for that vendor. Leave unset
      # to fall back to DuckDuckGo (search) or the local fetch+Turndown path (fetch).
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
    volumes:
      - ${DATAPILOT_DATA_DIR:-~/.datapilot}:/home/datapilot/.datapilot
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'await fetch(\"http://localhost:9101/\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.viewer
    depends_on:
      - server
    ports:
      - "${VIEWER_PORT:-9101}:9101"
    environment:
      - VIEWER_HOST=0.0.0.0
      - VIEWER_PORT=9101
      - VIEWER_BASE_URL=${VIEWER_BASE_URL:-http://localhost:9101}
    volumes:
      - ${VIEWER_DATA_DIR:-viewer-data}:/data
    restart: unless-stopped

volumes:
  viewer-data:
