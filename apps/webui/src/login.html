<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DataPilot — Login</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#1F1F24" />
  <style>
    /*
     * Login page — kept in sync with the renderer theme defined in
     * apps/electron/src/renderer/index.css. Two values must track:
     *   --accent    matches the brand accent (orange in light, purple in dark)
     *   --font-*    matches the Kami serif stack used app-wide
     * Border radius is 0 to match the rest of the UI.
     */
    :root {
      color-scheme: light dark;

      --page-bg: oklch(0.98 0.003 265);
      --page-fg: oklch(0.185 0.01 270);
      --card-bg: color-mix(in srgb, var(--page-bg) 90%, transparent);
      --card-border: color-mix(in srgb, var(--page-fg) 12%, transparent);
      --card-shadow: 0 24px 72px color-mix(in srgb, var(--page-fg) 8%, transparent),
                     0 8px 24px color-mix(in srgb, var(--page-fg) 5%, transparent);
      --subtitle: color-mix(in srgb, var(--page-fg) 56%, transparent);
      --input-bg: color-mix(in srgb, var(--page-bg) 70%, transparent);
      --input-border: color-mix(in srgb, var(--page-fg) 18%, transparent);
      --placeholder: color-mix(in srgb, var(--page-fg) 35%, transparent);

      --accent: oklch(0.6716 0.1368 48.5130);    /* light-mode brand accent (orange) */
      --accent-hover: oklch(0.62 0.14 48.5);
      --accent-ring: color-mix(in srgb, var(--accent) 18%, transparent);

      --ambient: color-mix(in srgb, var(--accent) 14%, transparent);
      --ambient-soft: color-mix(in srgb, var(--accent) 7%, transparent);

      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-fg: #b91c1c;

      --font-serif: Charter, Georgia, "TsangerJinKai02", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", Palatino, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-serif);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: var(--page-bg);
      color: var(--page-fg);
      padding: 16px;
    }

    body::before {
      content: '';
      position: absolute;
      inset: -18%;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 20%, var(--ambient) 0, transparent 38%),
        radial-gradient(circle at 82% 22%, var(--ambient-soft) 0, transparent 32%),
        radial-gradient(circle at 76% 78%, var(--ambient) 0, transparent 36%),
        radial-gradient(circle at 28% 80%, var(--ambient-soft) 0, transparent 30%);
      filter: blur(48px);
      opacity: 0.85;
      transform: scale(1.08);
      animation: drift 28s ease-in-out infinite alternate;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 28rem;
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0;
      text-align: center;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.005em;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 20rem;
      font-size: 13px;
      line-height: 1.5;
      color: var(--subtitle);
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: var(--font-serif);
      border: 1px solid var(--input-border);
      border-radius: 0;
      outline: none;
      background: var(--input-bg);
      color: var(--page-fg);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input::placeholder {
      color: var(--placeholder);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-serif);
      color: white;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 0;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, filter 0.15s;
    }

    button:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 13px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 0;
      color: var(--error-fg);
    }

    .error.visible { display: block; }

    @keyframes drift {
      from { transform: scale(1.08) translate3d(-2%, -1%, 0); }
      to { transform: scale(1.12) translate3d(2%, 1.5%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: oklch(0.145 0.015 270);
        --page-fg: oklch(0.95 0.01 270);
        --card-bg: color-mix(in srgb, var(--page-bg) 82%, transparent);
        --card-border: color-mix(in srgb, var(--page-fg) 14%, transparent);
        --card-shadow: 0 24px 72px rgba(0, 0, 0, 0.4),
                       0 8px 24px rgba(0, 0, 0, 0.22);
        --subtitle: color-mix(in srgb, var(--page-fg) 60%, transparent);
        --input-bg: color-mix(in srgb, var(--page-bg) 70%, transparent);
        --input-border: color-mix(in srgb, var(--page-fg) 18%, transparent);
        --placeholder: color-mix(in srgb, var(--page-fg) 32%, transparent);

        --accent: oklch(0.65 0.22 293);          /* dark-mode brand accent (purple) */
        --accent-hover: oklch(0.7 0.22 293);
        --accent-ring: color-mix(in srgb, var(--accent) 22%, transparent);

        --ambient: color-mix(in srgb, var(--accent) 18%, transparent);
        --ambient-soft: color-mix(in srgb, var(--accent) 9%, transparent);

        --error-bg: #2d1a1a;
        --error-border: #5a2020;
        --error-fg: #f5a0a0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>DataPilot</h1>
    <p class="subtitle">Enter your server token to continue</p>

    <form id="login-form">
      <label for="password">Server Token</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter DATAPILOT_SERVER_TOKEN"
        autocomplete="current-password"
        autofocus
        required
      >
      <button type="submit" id="submit-btn">Sign In</button>
    </form>

    <div id="error" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const password = document.getElementById('password').value;
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          // Cookie is set by the response — redirect to app
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Authentication failed';
        errorEl.classList.add('visible');
      } catch (err) {
        errorEl.textContent = 'Network error — is the server running?';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
